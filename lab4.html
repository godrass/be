<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="lab4.css">
    <script src="lab4.js" defer></script>
</head>
<body>
    <div class="page">
        <div class="calculator">
            <div class="top-panel">
                <h1>Калькулятор</h1>
                <p>Valar Morghulis:)</p>
            </div>

            <div class="display">
                <div class="previous-operation" id="previousOperation"></div>
                <div class="current-input" id="currentInput">0</div>
            </div>

            <div class="buttons">
                <button class="btn function" data-action="clear">AC</button>
                <button class="btn function" data-action="delete">DEL</button>
                <button class="btn function" data-action="percent">%</button>
                <button class="btn operator" data-value="/">÷</button>

                <button class="btn number" data-value="7">7</button>
                <button class="btn number" data-value="8">8</button>
                <button class="btn number" data-value="9">9</button>
                <button class="btn operator" data-value="*">×</button>

                <button class="btn number" data-value="4">4</button>
                <button class="btn number" data-value="5">5</button>
                <button class="btn number" data-value="6">6</button>
                <button class="btn operator" data-value="-">−</button>

                <button class="btn number" data-value="1">1</button>
                <button class="btn number" data-value="2">2</button>
                <button class="btn number" data-value="3">3</button>
                <button class="btn operator" data-value="+">+</button>

                <button class="btn number zero" data-value="0">0</button>
                <button class="btn number" data-value=".">.</button>
                <button class="btn equals" data-action="calculate">=</button>
            </div>
        </div>

        <div class="history-panel">
            <div class="history-header">
                <h2>Історія</h2>
                <button id="clearHistoryBtn">Очистити</button>
            </div>
            <ul id="historyList" class="history-list">
                <li class="empty-history">Історія порожня</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
